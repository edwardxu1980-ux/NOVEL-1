name: 生成角色形象图片

on:
  push:
    branches:
      - claude/continue-work-uGqSS
    paths:
      - 'characters/portraits/.trigger'
  workflow_dispatch:
    inputs:
      character:
        description: '角色名称'
        required: true
        type: choice
        options: [叶枫, 路佳, 左胧月]
      variant:
        description: '变体（all=全部）'
        required: true
        default: '标准半身像'
        type: choice
        options:
          - 标准半身像
          - 正脸特写
          - 狙击手姿态
          - 外交官学院制服站姿
          - 情感时刻
          - 班长指挥
          - 情感破防
          - 窗边俯视
          - 印记显现
          - 觉醒爆发
          - all
      model:
        description: '模型'
        required: true
        default: 'black-forest-labs/FLUX.1-dev'
        type: choice
        options:
          - black-forest-labs/FLUX.1-dev
          - black-forest-labs/FLUX.1-schnell
          - Kwai-Kolors/Kolors
      steps:
        description: '推理步数（20快/30标准/40高质量）'
        required: true
        default: '30'
      seed:
        description: '随机种子（留空=随机）'
        required: false
        default: ''
      siliconflow_api_key:
        description: 'SiliconFlow API Key'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: claude/continue-work-uGqSS

      - name: 读取触发文件参数
        if: github.event_name == 'push'
        run: |
          cat characters/portraits/.trigger
          CHARACTER=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d['character'])")
          VARIANT=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d['variant'])")
          MODEL=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('model','black-forest-labs/FLUX.1-dev'))")
          STEPS=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('steps',30))")
          SEED=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('seed',''))")
          API_KEY=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('siliconflow_api_key',''))")
          echo "CHARACTER=$CHARACTER" >> $GITHUB_ENV
          echo "VARIANT=$VARIANT" >> $GITHUB_ENV
          echo "MODEL=$MODEL" >> $GITHUB_ENV
          echo "STEPS=$STEPS" >> $GITHUB_ENV
          echo "SEED=$SEED" >> $GITHUB_ENV
          echo "TRIGGER_API_KEY=$API_KEY" >> $GITHUB_ENV

      - name: 设置 workflow_dispatch 参数
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "CHARACTER=${{ github.event.inputs.character }}" >> $GITHUB_ENV
          echo "VARIANT=${{ github.event.inputs.variant }}" >> $GITHUB_ENV
          echo "MODEL=${{ github.event.inputs.model }}" >> $GITHUB_ENV
          echo "STEPS=${{ github.event.inputs.steps }}" >> $GITHUB_ENV
          echo "SEED=${{ github.event.inputs.seed }}" >> $GITHUB_ENV
          echo "TRIGGER_API_KEY=${{ github.event.inputs.siliconflow_api_key }}" >> $GITHUB_ENV

      - name: 安装依赖
        run: pip install requests

      - name: 生成图片
        run: |
          EFFECTIVE_KEY="${{ secrets.SILICONFLOW_API_KEY }}"
          [ -z "$EFFECTIVE_KEY" ] && EFFECTIVE_KEY="$TRIGGER_API_KEY"
          SEED_ARG=""
          [ -n "$SEED" ] && SEED_ARG="--seed $SEED"
          python3 workflow/generate_character_portrait.py \
            --character "$CHARACTER" \
            --variant "$VARIANT" \
            --model "$MODEL" \
            --steps "$STEPS" \
            --output-dir "/tmp/portraits" \
            --api-key "$EFFECTIVE_KEY" \
            $SEED_ARG
          ls -lh /tmp/portraits/

      - name: 上传 Artifact（14天有效）
        uses: actions/upload-artifact@v4
        with:
          name: portraits-${{ env.CHARACTER }}-${{ github.run_number }}
          path: /tmp/portraits/*.png
          retention-days: 14

      - name: 提交图片到 generated-images 分支（Python 实现，无签名保护）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ls -lh /tmp/portraits/
          python3 << 'PYEOF'
          import os, json, base64, urllib.parse, urllib.request, sys

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          character = os.environ['CHARACTER']
          variant = os.environ['VARIANT']
          portraits_dir = '/tmp/portraits'

          png_files = sorted(f for f in os.listdir(portraits_dir) if f.endswith('.png'))
          if not png_files:
              print("ERROR: 没有找到任何 PNG 文件，跳过提交")
              sys.exit(1)

          for png in png_files:
              print(f"提交: {png}")
              with open(os.path.join(portraits_dir, png), 'rb') as f:
                  b64 = base64.b64encode(f.read()).decode('ascii')

              path = 'characters/portraits/' + urllib.parse.quote(png)

              # 查询是否已有文件（获取 SHA）
              sha = None
              check_req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/contents/{path}?ref=generated-images',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
              )
              try:
                  with urllib.request.urlopen(check_req) as r:
                      sha = json.loads(r.read()).get('sha')
                      print(f"  已存在，SHA={sha[:8]}...")
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      print(f"  查询警告: {e.code}")

              body = {'message': f'auto: {character} - {variant}', 'content': b64, 'branch': 'generated-images'}
              if sha:
                  body['sha'] = sha

              put_req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/contents/{path}',
                  data=json.dumps(body).encode('utf-8'),
                  method='PUT',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                  }
              )
              try:
                  with urllib.request.urlopen(put_req) as r:
                      result = json.loads(r.read())
                      name = result.get('content', {}).get('name', '?')
                      sha_new = result.get('content', {}).get('sha', '?')[:8]
                      print(f"  SUCCESS: {name} -> generated-images (SHA {sha_new})")
              except urllib.error.HTTPError as e:
                  err = e.read().decode()
                  print(f"  ERROR PUT {e.code}: {err[:300]}")
                  sys.exit(1)
          PYEOF
