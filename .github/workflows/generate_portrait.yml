name: 生成角色形象图片

on:
  push:
    branches:
      - claude/continue-work-uGqSS
    paths:
      - 'characters/portraits/.trigger'
  workflow_dispatch:
    inputs:
      character:
        description: '角色名称'
        required: true
        type: choice
        options: [叶枫, 路佳, 左胧月]
      variant:
        description: '变体（all=全部）'
        required: true
        default: '标准半身像'
        type: choice
        options:
          - 标准半身像
          - 正脸特写
          - 狙击手姿态
          - 外交官学院制服站姿
          - 情感时刻
          - 班长指挥
          - 情感破防
          - 窗边俯视
          - 印记显现
          - 觅醒爆发
          - all
      model:
        description: '模型'
        required: true
        default: 'black-forest-labs/FLUX.1-dev'
        type: choice
        options:
          - black-forest-labs/FLUX.1-dev
          - black-forest-labs/FLUX.1-schnell
          - Kwai-Kolors/Kolors
      steps:
        description: '推理步数（20快/30标准/40高质量）'
        required: true
        default: '30'
      seed:
        description: '随机种子（留空=随机）'
        required: false
        default: ''
      siliconflow_api_key:
        description: 'SiliconFlow API Key'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: claude/continue-work-uGqSS

      - name: 读取触发文件参数
        if: github.event_name == 'push'
        run: |
          cat characters/portraits/.trigger
          CHARACTER=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d['character'])")
          VARIANT=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d['variant'])")
          MODEL=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('model','black-forest-labs/FLUX.1-dev'))")
          STEPS=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('steps',30))")
          SEED=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('seed',''))")
          API_KEY=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('siliconflow_api_key',''))")
          echo "CHARACTER=$CHARACTER" >> $GITHUB_ENV
          echo "VARIANT=$VARIANT" >> $GITHUB_ENV
          echo "MODEL=$MODEL" >> $GITHUB_ENV
          echo "STEPS=$STEPS" >> $GITHUB_ENV
          echo "SEED=$SEED" >> $GITHUB_ENV
          echo "TRIGGER_API_KEY=$API_KEY" >> $GITHUB_ENV

      - name: 设置 workflow_dispatch 参数
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "CHARACTER=${{ github.event.inputs.character }}" >> $GITHUB_ENV
          echo "VARIANT=${{ github.event.inputs.variant }}" >> $GITHUB_ENV
          echo "MODEL=${{ github.event.inputs.model }}" >> $GITHUB_ENV
          echo "STEPS=${{ github.event.inputs.steps }}" >> $GITHUB_ENV
          echo "SEED=${{ github.event.inputs.seed }}" >> $GITHUB_ENV
          echo "TRIGGER_API_KEY=${{ github.event.inputs.siliconflow_api_key }}" >> $GITHUB_ENV

      - name: 安装依赖
        run: pip install requests

      - name: 生成图片
        run: |
          EFFECTIVE_KEY="${{ secrets.SILICONFLOW_API_KEY }}"
          [ -z "$EFFECTIVE_KEY" ] && EFFECTIVE_KEY="$TRIGGER_API_KEY"
          SEED_ARG=""
          [ -n "$SEED" ] && SEED_ARG="--seed $SEED"
          python3 workflow/generate_character_portrait.py \
            --character "$CHARACTER" \
            --variant "$VARIANT" \
            --model "$MODEL" \
            --steps "$STEPS" \
            --output-dir "characters/portraits" \
            --api-key "$EFFECTIVE_KEY" \
            $SEED_ARG
          ls -lh characters/portraits/*.png

      - name: 上传 Artifact（14天有效）
        uses: actions/upload-artifact@v4
        with:
          name: portraits-${{ env.CHARACTER }}-${{ github.run_number }}
          path: characters/portraits/*.png
          retention-days: 14

      - name: 通过 GitHub Contents API 提交图片
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import base64, json, os, glob, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          repo  = 'edwardxu1980-ux/novel-1'
          branch = 'claude/continue-work-uGqSS'
          char  = os.environ.get('CHARACTER', '')
          variant = os.environ.get('VARIANT', '')

          def api(method, path, body=None):
              url = f'https://api.github.com/repos/{repo}/contents/{path}'
              data = json.dumps(body).encode() if body else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return json.loads(e.read())

          pngs = glob.glob('characters/portraits/*.png')
          print(f'Found {len(pngs)} PNG files')
          for png in pngs:
              rel_path = png  # relative to repo root
              with open(png, 'rb') as f:
                  content_b64 = base64.b64encode(f.read()).decode()
              # Check if file already exists (need its SHA to update)
              existing = api('GET', rel_path)
              sha = existing.get('sha')
              body = {
                  'message': f'\u81ea\u52a8\u751f\u6210\uff1a{char} - {variant}',
                  'content': content_b64,
                  'branch': branch,
              }
              if sha:
                  body['sha'] = sha
              result = api('PUT', rel_path, body)
              if 'content' in result:
                  print(f'  OK: {rel_path}')
              else:
                  print(f'  FAIL: {rel_path}: {result}')
          PYEOF
