name: 生成角色形象图片

on:
  push:
    branches:
      - claude/continue-work-uGqSS
    paths:
      - 'characters/portraits/.trigger'
  workflow_dispatch:
    inputs:
      character:
        description: '角色名称'
        required: true
        type: choice
        options: [叶枫, 路佳, 左胧月]
      variant:
        description: '变体（all=全部）'
        required: true
        default: '标准半身像'
        type: choice
        options:
          - 标准半身像
          - 正脸特写
          - 狙击手姿态
          - 外交官学院制服站姿
          - 情感时刻
          - 班长指挥
          - 情感破防
          - 窗边俯视
          - 印记显现
          - 觉醒爆发
          - all
      model:
        description: '模型'
        required: true
        default: 'black-forest-labs/FLUX.1-dev'
        type: choice
        options:
          - black-forest-labs/FLUX.1-dev
          - black-forest-labs/FLUX.1-schnell
          - Kwai-Kolors/Kolors
      steps:
        description: '推理步数（20快/30标准/40高质量）'
        required: true
        default: '30'
      seed:
        description: '随机种子（留空=随机）'
        required: false
        default: ''
      siliconflow_api_key:
        description: 'SiliconFlow API Key'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: claude/continue-work-uGqSS
          fetch-depth: 0

      - name: 读取触发文件参数（push 触发时）
        if: github.event_name == 'push'
        run: |
          cat characters/portraits/.trigger
          CHARACTER=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d['character'])")
          VARIANT=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d['variant'])")
          MODEL=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('model','black-forest-labs/FLUX.1-dev'))")
          STEPS=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('steps',30))")
          SEED=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('seed',''))")
          API_KEY=$(python3 -c "import json; d=json.load(open('characters/portraits/.trigger')); print(d.get('siliconflow_api_key',''))")
          echo "CHARACTER=$CHARACTER" >> $GITHUB_ENV
          echo "VARIANT=$VARIANT" >> $GITHUB_ENV
          echo "MODEL=$MODEL" >> $GITHUB_ENV
          echo "STEPS=$STEPS" >> $GITHUB_ENV
          echo "SEED=$SEED" >> $GITHUB_ENV
          echo "TRIGGER_API_KEY=$API_KEY" >> $GITHUB_ENV

      - name: 设置 workflow_dispatch 参数
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "CHARACTER=${{ github.event.inputs.character }}" >> $GITHUB_ENV
          echo "VARIANT=${{ github.event.inputs.variant }}" >> $GITHUB_ENV
          echo "MODEL=${{ github.event.inputs.model }}" >> $GITHUB_ENV
          echo "STEPS=${{ github.event.inputs.steps }}" >> $GITHUB_ENV
          echo "SEED=${{ github.event.inputs.seed }}" >> $GITHUB_ENV
          echo "TRIGGER_API_KEY=${{ github.event.inputs.siliconflow_api_key }}" >> $GITHUB_ENV

      - name: 安装依赖
        run: pip install requests

      - name: 生成图片
        run: |
          EFFECTIVE_KEY="${{ secrets.SILICONFLOW_API_KEY }}"
          [ -z "$EFFECTIVE_KEY" ] && EFFECTIVE_KEY="$TRIGGER_API_KEY"
          SEED_ARG=""
          [ -n "$SEED" ] && SEED_ARG="--seed $SEED"
          python3 workflow/generate_character_portrait.py \
            --character "$CHARACTER" \
            --variant "$VARIANT" \
            --model "$MODEL" \
            --steps "$STEPS" \
            --output-dir "characters/portraits" \
            --api-key "$EFFECTIVE_KEY" \
            $SEED_ARG

      - name: 上传 Artifact（14天有效）
        uses: actions/upload-artifact@v4
        with:
          name: portraits-${{ env.CHARACTER }}-${{ github.run_number }}
          path: characters/portraits/*.png
          retention-days: 14

      - name: 提交图片到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add characters/portraits/*.png
          if git diff --staged --quiet; then
            echo "无新图片，跳过提交"
          else
            git commit -m "自动生成：$CHARACTER - $VARIANT"
            # rebase 后再 push，避免因并发提交导致拒绝
            git pull --rebase origin claude/continue-work-uGqSS
            git push origin claude/continue-work-uGqSS
          fi
